# cargo deny check: licences, advisories, bans, sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
  # rsa: Marvin timing side channel in PKCS#1 v1.5 decryption. MQTT Panel only generates RSA 2048 keys
  # with this crate (ring cannot); signing goes through ring. No decryption with rsa happens.
  { id = "RUSTSEC-2023-0071", reason = "rsa used for key generation only" },
  # proc-macro-error: unmaintained build-time macro crate pulled by the GTK bindings of Tauri on Linux.
  { id = "RUSTSEC-2024-0370", reason = "build-time only, Linux GTK bindings of Tauri; no safe upgrade upstream" },
]

[licenses]
version = 2
# Allowed licences (CLAUDE.md): MIT, Apache 2.0, BSD, ISC, MPL 2.0, plus permissive equivalents used by common crates.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
