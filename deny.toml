# cargo deny check: licences, advisories, bans, sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Allowed licences (CLAUDE.md): MIT, Apache 2.0, BSD, ISC, MPL 2.0, plus permissive equivalents used by common crates.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
