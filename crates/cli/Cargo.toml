[package]
name = "mqttpanel-cli"
description = "Command line of MQTT Panel: sub, pub, broker and profiles"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "mqttpanel"
path = "src/main.rs"

[dependencies]
mqttpanel-client.workspace = true
mqttpanel-profiles.workspace = true
mqttpanel-tls.workspace = true
mqttpanel-broker.workspace = true
mqttpanel-shim.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
hex.workspace = true
clap = { version = "4.5", default-features = false, features = ["std", "derive", "error-context"] }
rpassword = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
uuid.workspace = true
mqttpanel-tls.workspace = true
