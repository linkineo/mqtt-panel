[package]
name = "mqttpanel-shim"
description = "The MCP stdio shim of MQTT Panel: forwards a host's stdio to the running app's local socket"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
publish = false

[dependencies]
tokio = { workspace = true }
mqttpanel-profiles.workspace = true

[target.'cfg(windows)'.dependencies]
# The pipe's owner-only security descriptor and the check of who serves it (already in the tree through tokio).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }
