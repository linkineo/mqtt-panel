[package]
name = "mqttpanel-desktop"
description = "MQTT Panel desktop app (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "mqtt-panel"
path = "src/main.rs"

[features]
# Compiled into the direct macOS download only (scripts/release-mac-dmg.sh).
self-update = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
uuid.workspace = true
mqttpanel-engine.workspace = true
mqttpanel-client.workspace = true
mqttpanel-profiles.workspace = true
mqttpanel-tls.workspace = true
mqttpanel-broker.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
rustls-pki-types.workspace = true
rmcp = { version = "3.6", default-features = false, features = ["server"] }
toml_edit = "0.25"
dirs = "6"
mqttpanel-shim.workspace = true
# Self-update, Developer ID DMG only (docs/UPDATER.md); store and developer builds never compile it. No "zip"
# feature: it only serves Windows bundles of Tauri 1 (macOS uses tar and flate2).
tauri-plugin-updater = { version = "2", optional = true, default-features = false, features = ["rustls-tls", "system-proxy"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.6", default-features = false, features = ["server", "client"] }
